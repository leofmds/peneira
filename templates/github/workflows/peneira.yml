name: peneira

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: peneira-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: __ACTION_REF__
        with:
          step: policy
