name: peneira-metrics

on:
  schedule:
    - cron: '0 11 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: __ACTION_REF__
        with:
          step: metrics
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.REVIEW_METRICS_SLACK_WEBHOOK }}
